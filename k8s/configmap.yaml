apiVersion: v1
kind: ConfigMap
metadata:
  name: thesisledger-config
  namespace: thesisledger
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api,api.thesisledger.svc.cluster.local"
  POSTGRES_HOST: "db"
  POSTGRES_DB: "thesisledger"
  POSTGRES_USER: "thesisledger"
  REDIS_URL: "redis://redis:6379/0"
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.2:3b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  USE_REAL_ANALYSIS: "true"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
