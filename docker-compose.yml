services:
  db:
    image: pgvector/pgvector:pg16
    container_name: thesisledger-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thesisledger}
      POSTGRES_USER: ${POSTGRES_USER:-thesisledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thesisledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thesisledger} -d ${POSTGRES_DB:-thesisledger}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: thesisledger-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: thesisledger-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - with-ollama

  api:
    build:
      context: ./backend
    container_name: thesisledger-api
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: thesisledger-worker
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: thesisledger-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  ollama_models:
