services:
  db:
    image: pgvector/pgvector:pg16
    container_name: thesisledger-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thesisledger}
      POSTGRES_USER: ${POSTGRES_USER:-thesisledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thesisledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thesisledger} -d ${POSTGRES_DB:-thesisledger}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: thesisledger-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
