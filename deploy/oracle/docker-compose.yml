# Oracle VM — inference node.
#
# Everything else runs elsewhere: API + worker on Railway, Postgres on
# Supabase, Redis on Upstash, frontend on Vercel. This box only serves Ollama,
# behind Caddy for TLS and a bearer token.
#
#   cp .env.example .env    # DOMAIN, ACME_EMAIL, OLLAMA_TOKEN
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:3b
#   docker compose exec ollama ollama pull nomic-embed-text

services:
  ollama:
    image: ollama/ollama:latest
    container_name: thesisledger-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # One request at a time: 2 cores, and concurrent inference just makes
      # every request slower while risking the OOM killer.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    deploy:
      resources:
        limits:
          memory: 5G   # box has 7.7G; leave room for the OS

  caddy:
    image: caddy:2-alpine
    container_name: thesisledger-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      DOMAIN: ${DOMAIN:?required}
      ACME_EMAIL: ${ACME_EMAIL:?required}
      OLLAMA_TOKEN: ${OLLAMA_TOKEN:?required}
    depends_on:
      - ollama

volumes:
  ollama_models:
  caddy_data:
